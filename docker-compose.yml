services:
  postgres:
    image: postgres:16-alpine
    container_name: fluent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluent
      POSTGRES_PASSWORD: fluent
      POSTGRES_DB: fluent
    ports:
      - "5432:5432"
    volumes:
      - fluent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluent -d fluent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fluent-pgdata:
